<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Greek">
    <meta name="theme-color" content="#0d5eaf">
    <title>Greek Match</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png?v=2">
    <link rel="apple-touch-icon" href="icons/icon-192.png?v=2">
    <link rel="stylesheet" href="css/game.css?v=8">
</head>
<body>
<header class="topbar">
    <nav class="sections" id="sections" aria-label="Section">
        <button class="section active" data-section="words">Words</button>
        <button class="section" data-section="practice">Practice</button>
    </nav>
</header>
<div class="tabrow">
    <nav class="tabs" id="tabs" aria-label="Mode"></nav>
</div>

<p class="subtitle" id="subtitle">Drag the Greek word to its English meaning</p>

<div id="score-banner"></div>

<div class="game">
    <div class="game-header">
        <div class="header-left">
            <select class="mode-select" id="group-select" aria-label="Group">
                <option value="__all__">All groups</option>
            </select>
        </div>
        <div class="lang-toggle">
            <button class="lang-btn active" id="lang-gr" title="Guess Greek">&#x1F1EC;&#x1F1F7;</button>
            <button class="lang-btn" id="lang-en" title="Guess English">&#x1F1EC;&#x1F1E7;</button>
        </div>
    </div>
    <div id="match-container">
        <div class="bank" id="bank"></div>
        <div class="pairs" id="pairs"></div>
    </div>

    <div id="conj-container" style="display:none">
        <div class="typing-header">
            <span id="conj-progress">1 / 6</span>
        </div>
        <div id="conj-prompt"></div>
        <form id="conj-form" autocomplete="off">
            <input type="text" id="conj-input" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
            <button type="submit" id="conj-submit">Check</button>
        </form>
        <div id="conj-feedback"></div>
        <ul id="conj-history"></ul>
    </div>

    <div id="dates-container" style="display:none">
        <div class="quiz-header">
            <span id="dates-progress">1 / 10</span>
            <span id="dates-topic"></span>
        </div>
        <div id="dates-sub"></div>
        <div id="dates-prompt"></div>
        <div id="dates-options"></div>
    </div>

    <div id="fill-container" style="display:none">
        <div class="fill-header">
            <span id="fill-progress">1 / 6</span>
            <span id="fill-topic"></span>
        </div>
        <div id="fill-prompt"></div>
        <div id="fill-sentence"></div>
        <div id="fill-blanks"></div>
    </div>

    <div id="typing-container" style="display:none">
        <div class="typing-header">
            <span id="typing-progress">1 / 6</span>
        </div>
        <div id="typing-word"></div>
        <form id="typing-form" autocomplete="off">
            <input type="text" id="typing-input" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
            <button type="submit" id="typing-submit">Check</button>
        </form>
        <div id="typing-feedback"></div>
        <ul id="typing-history"></ul>
    </div>

    <div id="browse-container" style="display:none">
        <input type="search" id="browse-search" placeholder="Search Greek or English"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="browse-count" id="browse-count"></div>
        <ul class="word-list" id="browse-list"></ul>
    </div>

    <div class="actions">
        <button id="btn-check">Check Answers</button>
        <button id="btn-retry" style="display:none">Try Again</button>
        <button id="btn-new"   style="display:none">New Round</button>
    </div>
</div>

<script src="js/conjugations.js?v=12"></script>
<script src="js/conjugator.js?v=1"></script>
<script src="js/datetime.js?v=3"></script>
<script src="js/game.js?v=24"></script>
<script src="js/browse.js?v=1"></script>
</body>
</html>
